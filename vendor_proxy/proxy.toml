[server]
listen_addr = "127.0.0.1:8787"

# Claude Desktop -> DeepSeek Anthropic
[bridges.claude_desktop_deepseek.agent]
base_url = "/deepseek_anthropic"
api_format = "anthropic_messages"

[bridges.claude_desktop_deepseek.provider]
name = "deepseek_anthropic"

[bridges.claude_desktop_deepseek.models]
"claude-sonnet" = "deepseek-v4-pro[1m]"
"claude-haiku" = "deepseek-v4-flash"
"claude-opus" = "deepseek-v4-pro[1m]"

# Claude Desktop -> Zhipu Anthropic
[bridges.claude_desktop_zhipu.agent]
base_url = "/zhipu_anthropic"
api_format = "anthropic_messages"

[bridges.claude_desktop_zhipu.provider]
name = "zhipu_anthropic"

[bridges.claude_desktop_zhipu.models]
"claude-sonnet" = "glm-5.1"
"claude-haiku" = "glm-5.1"
"claude-opus" = "glm-5.1"

[providers.deepseek_anthropic]
base_url = "https://api.deepseek.com/anthropic"
api_format = "anthropic_messages"
api_key_env = "DEEPSEEK_API_KEY"

[providers.zhipu_anthropic]
base_url = "https://open.bigmodel.cn/api/anthropic"
api_format = "anthropic_messages"
api_key_env = "ZHIPU_API_KEY"

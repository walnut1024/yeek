# vendor_proxy bridge-based integration tests
#
# Variables:
#   {{BASE_URL}}  — proxy address (default http://127.0.0.1:8787)
#   {{DEEPSEEK_API_KEY}} — DeepSeek API key
#   {{ZHIPU_API_KEY}} — Zhipu API key

# ── Health & Discovery ──────────────────────────────────────────────

- name: health_check
  method: GET
  path: /health
  expect:
    status: 200

- name: models_list
  method: GET
  path: /v1/models
  expect:
    status: 200
    json:
      - path: models
        type: array
        min_length: 1

# ── Claude Desktop → Zhipu Anthropic ────────────────────────────────

- name: anthropic_passthrough_non_stream
  description: Claude Desktop → Zhipu Anthropic non-streaming
  method: POST
  path: /zhipu_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: claude-sonnet
    max_tokens: 64
    stream: false
    messages:
      - role: user
        content: "Reply with exactly: hello"
  expect:
    status: 200
    json:
      - path: type
        equals: message
      - path: content
        type: array
        min_length: 1
      - path: stop_reason
        not_equals: null
    latency_ms: 30000

- name: anthropic_passthrough_stream
  description: Claude Desktop → Zhipu Anthropic streaming
  method: POST
  path: /zhipu_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: claude-sonnet
    max_tokens: 64
    stream: true
    messages:
      - role: user
        content: "Reply with exactly: hi"
  stream: true
  expect:
    status: 200
    stream_contains:
      - message_start
      - content_block_delta
      - message_stop
    latency_ms: 30000

# ── Claude Desktop → DeepSeek Anthropic ─────────────────────────────

- name: deepseek_anthropic_non_stream
  description: Claude Desktop → DeepSeek Anthropic non-streaming
  method: POST
  path: /deepseek_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: claude-sonnet
    max_tokens: 64
    stream: false
    messages:
      - role: user
        content: "Reply with exactly one word: hello"
  expect:
    status: 200
    json:
      - path: type
        equals: message
      - path: content
        type: array
        min_length: 1
      - path: stop_reason
        not_equals: null
    latency_ms: 30000

- name: deepseek_anthropic_stream
  description: Claude Desktop → DeepSeek Anthropic streaming
  method: POST
  path: /deepseek_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: claude-sonnet
    max_tokens: 64
    stream: true
    messages:
      - role: user
        content: "Reply with exactly one word: hi"
  stream: true
  expect:
    status: 200
    stream_contains:
      - message_start
      - content_block_delta
      - message_stop
    latency_ms: 30000

# ── Model mapping ───────────────────────────────────────────────────

- name: model_map_exact_match
  description: Exact model map claude-sonnet → deepseek-v4-pro[1m]
  method: POST
  path: /deepseek_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: claude-sonnet
    max_tokens: 32
    stream: false
    messages:
      - role: user
        content: "Say ok"
  expect:
    status: 200
    json:
      - path: type
        equals: message
    latency_ms: 30000

- name: model_map_rejects_unconfigured_family
  description: No family fallback; partial haiku model is rejected
  method: POST
  path: /deepseek_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: claude-haiku-4-5
    max_tokens: 32
    stream: false
    messages:
      - role: user
        content: "Say ok"
  expect:
    status: 400

- name: model_map_rejects_unknown_model
  description: Unknown model is rejected instead of default fallback
  method: POST
  path: /deepseek_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: unknown-model-xyz
    max_tokens: 32
    stream: false
    messages:
      - role: user
        content: "Say ok"
  expect:
    status: 400

# ── Anthropic request with system prompt ────────────────────────────

- name: anthropic_with_system_prompt
  description: System prompt passed through to DeepSeek Anthropic
  method: POST
  path: /deepseek_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: claude-sonnet
    max_tokens: 256
    stream: false
    system: "You are a pirate. Always respond in pirate speak."
    messages:
      - role: user
        content: "Hello"
  expect:
    status: 200
    json:
      - path: content
        type: array
        min_length: 1
    latency_ms: 30000

# ── Multi-turn conversation ─────────────────────────────────────────

- name: anthropic_multi_turn
  description: Multi-turn Anthropic conversation through DeepSeek Anthropic
  method: POST
  path: /deepseek_anthropic/v1/messages
  headers:
    content-type: application/json
  body:
    model: claude-sonnet
    max_tokens: 64
    stream: false
    messages:
      - role: user
        content: "My name is TestUser. Remember it."
      - role: assistant
        content: "I'll remember your name is TestUser."
      - role: user
        content: "What is my name?"
  expect:
    status: 200
    latency_ms: 30000

# ── Error handling ──────────────────────────────────────────────────

- name: invalid_json_body
  description: Invalid JSON returns error
  method: POST
  path: /deepseek_anthropic/v1/messages
  headers:
    content-type: application/json
  body_raw: "not json at all"
  expect:
    status: 400
